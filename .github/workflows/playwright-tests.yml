name: Playwright Tests with Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_grep:
        description: 'Run specific tests (e.g., @smoke, @login, @cart)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

env:
  RETENTION_DAYS: ${{ github.event_name == 'pull_request' && 14 || 30 }}
  ARTIFACT_SUFFIX: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  PAGES_URL: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  SHARDS_PER_BROWSER: 3  
  NUMBER_OF_BROWSERS: 3
  
jobs:
  install:
    name: Install Dependencies
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

  test:
    name: ${{ matrix.browser }} (Shard ${{ matrix.shard }}/${{ matrix.shardTotal }})
    needs: install
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
        shardTotal: [3] 

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Restore Playwright browsers cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Run Playwright tests (${{ matrix.browser }}, Shard ${{ matrix.shard }}/${{ matrix.shardTotal }})
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.shardTotal }} ${{ github.event.inputs.test_grep && format('--grep "{0}"', github.event.inputs.test_grep) || '' }}
        continue-on-error: true

      # Upload test results from this runner
      - name: Upload Allure results (${{ matrix.browser }}-${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('allure-results/**/*') != ''
        with:
          name: allure-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: allure-results
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Playwright report (${{ matrix.browser }}-${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('playwright-report/**/*') != ''
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report
          retention-days: 1
          if-no-files-found: warn

      - name: Upload test videos (${{ matrix.browser }}-${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        if: failure() && hashFiles('test-results/**/*') != ''
        with:
          name: test-videos-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  merge-reports:
    name: Merge Reports and Deploy
    needs: test
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-latest
    
    # GitHub Pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Download all Allure results from all browser-shard combinations
      - name: Download Allure results from all runners
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: allure-results-all
          merge-multiple: false

      # Merge all runner results into one directory
      - name: Merge Allure results from all runners
        run: |
          mkdir -p allure-results
          
          # Check if any artifacts were downloaded
          if [ ! -d "allure-results-all" ] || [ -z "$(ls -A allure-results-all 2>/dev/null)" ]; then
            echo "⚠️  Warning: No Allure results found to merge"
            echo "This might happen if all test jobs failed before generating results"
            # Create a placeholder to allow report generation
            echo '{"name":"No Tests Run","status":"broken","stage":"finished"}' > allure-results/empty-result.json
            exit 0
          fi
          
          echo "Merging results from all browser-shard combinations..."
          result_count=0
          for result_dir in allure-results-all/allure-results-*; do
            if [ -d "$result_dir" ]; then
              browser_shard=$(basename "$result_dir" | sed 's/allure-results-//')
              echo "  - Merging results from: $browser_shard"
              if cp -r "$result_dir"/* allure-results/ 2>/dev/null; then
                result_count=$((result_count + 1))
              fi
            fi
          done
          
          echo ""
          echo "✅ Merged results from $result_count shard(s)"
          echo "Total test result files:"
          ls -la allure-results/ | wc -l
          echo ""
          echo "Sample of merged files:"
          ls -la allure-results/ | head -20

      # Download history from previous GitHub Pages deployment
      - name: Download Allure history
        if: always()
        continue-on-error: true
        run: |
          mkdir -p allure-results/history
          curl -sSfL "https://${{ env.PAGES_URL }}/history/history.json" -o allure-results/history/history.json || true
          curl -sSfL "https://${{ env.PAGES_URL }}/history/history-trend.json" -o allure-results/history/history-trend.json || true
          curl -sSfL "https://${{ env.PAGES_URL }}/history/categories-trend.json" -o allure-results/history/categories-trend.json || true
          curl -sSfL "https://${{ env.PAGES_URL }}/history/duration-trend.json" -o allure-results/history/duration-trend.json || true
          curl -sSfL "https://${{ env.PAGES_URL }}/history/retry-trend.json" -o allure-results/history/retry-trend.json || true
          echo "History files downloaded:"
          ls -la allure-results/history/ || true

      - name: Generate Allure Report
        if: always()
        run: |
          # Ensure we have results directory
          if [ ! -d "allure-results" ] || [ -z "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "⚠️  Warning: No test results found, creating placeholder"
            mkdir -p allure-results
            echo '{"name":"No Tests Executed","status":"broken","stage":"finished"}' > allure-results/empty-result.json
          fi
          
          echo "Generating Allure report..."
          npx allure generate allure-results -o allure-report --clean
          
          # Verify report was created
          if [ -f "allure-report/index.html" ]; then
            echo "✅ Allure report generated successfully"
          else
            echo "❌ Failed to generate Allure report"
            exit 1
          fi

      # Upload artifacts
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('allure-report/**/*') != ''
        with:
          name: allure-report-${{ env.ARTIFACT_SUFFIX }}
          path: allure-report
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && hashFiles('allure-results/**/*') != ''
        with:
          name: allure-results-${{ env.ARTIFACT_SUFFIX }}
          path: allure-results
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: ignore

      # Upload Allure report for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always() && github.event_name != 'pull_request'
        with:
          path: allure-report

      # Deploy to GitHub Pages (skip for PRs)
      - name: Deploy to GitHub Pages
        id: deployment
        if: always() && github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4

      - name: Add test results summary
        if: always()
        run: |
          echo "## 📊 Test Results (Browser-Sharded Execution)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Browsers:** Chromium, Firefox, WebKit" >> $GITHUB_STEP_SUMMARY
          echo "**Shards per browser:** ${{ env.SHARDS_PER_BROWSER }}" >> $GITHUB_STEP_SUMMARY
          echo "**Total parallel runners:** $((${{ env.SHARDS_PER_BROWSER }} * ${{ env.NUMBER_OF_BROWSERS }}))" >> $GITHUB_STEP_SUMMARY
          echo "**Retention:** ${{ env.RETENTION_DAYS }} days" >> $GITHUB_STEP_SUMMARY
          ${{ github.event.inputs.test_grep && format('echo "**Filter:** `{0}`" >> $GITHUB_STEP_SUMMARY', github.event.inputs.test_grep) || '' }}
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Browsers Tested" >> $GITHUB_STEP_SUMMARY
          echo "- 🟦 **Chromium** (${{ env.SHARDS_PER_BROWSER }} shards)" >> $GITHUB_STEP_SUMMARY
          echo "- 🟧 **Firefox** (${{ env.SHARDS_PER_BROWSER }} shards)" >> $GITHUB_STEP_SUMMARY
          echo "- 🟪 **WebKit** (${{ env.SHARDS_PER_BROWSER }} shards)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if tests actually ran
          if [ -d "allure-results" ] && [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            result_files=$(ls -1 allure-results/*.json 2>/dev/null | wc -l)
            if [ "$result_files" -gt 1 ]; then
              echo "### ✅ Test Execution" >> $GITHUB_STEP_SUMMARY
              echo "Successfully merged results from $((${{ env.SHARDS_PER_BROWSER }} * ${{ env.NUMBER_OF_BROWSERS }})) runners" >> $GITHUB_STEP_SUMMARY
              echo "Total result files: $result_files" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ⚠️ Test Execution" >> $GITHUB_STEP_SUMMARY
              echo "No test results were generated. Tests may have failed to run." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ⚠️ Test Execution" >> $GITHUB_STEP_SUMMARY
            echo "No test results found. All test jobs may have failed." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **Merged Allure Report** - Combined from all $((${{ env.SHARDS_PER_BROWSER }} * ${{ env.NUMBER_OF_BROWSERS }})) runners" >> $GITHUB_STEP_SUMMARY
          echo "- **Individual Playwright Reports** - Per browser-shard combination" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Videos** - From failed tests (if any)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🌐 Live Report" >> $GITHUB_STEP_SUMMARY
            echo "View the comprehensive Allure report at: https://${{ env.PAGES_URL }}/" >> $GITHUB_STEP_SUMMARY
          fi
